<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">HC-SR04 ile bantta ürün sayma (yandan görünüm)</text>

  <!-- sensör -->
  <rect x="320" y="42" width="80" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="64" text-anchor="middle" font-size="13" fill="#1e3a8a">HC-SR04</text>
  <!-- ses konisi -->
  <polygon points="340,76 380,76 420,236 300,236" fill="#bfdbfe" fill-opacity="0.35" stroke="#60a5fa" stroke-dasharray="4 3"/>

  <!-- bant -->
  <rect x="40" y="236" width="640" height="16" rx="8" fill="#9ca3af"/>
  <circle cx="56" cy="244" r="11" fill="#6b7280"/>
  <circle cx="664" cy="244" r="11" fill="#6b7280"/>
  <text x="90" y="274" font-size="12" fill="#4b5563">bant →</text>

  <!-- ürün -->
  <rect x="318" y="176" width="84" height="60" rx="3" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="212" text-anchor="middle" font-size="13" fill="#92400e">ürün</text>

  <!-- eşik çizgileri -->
  <line x1="60" y1="96" x2="260" y2="96" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="64" y="90" font-size="12" fill="#b91c1c">85 cm üstü: bant boş</text>
  <line x1="60" y1="156" x2="260" y2="156" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="64" y="150" font-size="12" fill="#15803d">75 cm altı: ürün altında</text>

  <!-- mesafe oku -->
  <line x1="450" y1="76" x2="450" y2="176" stroke="#111827" stroke-width="1.2"/>
  <polygon points="450,76 445,86 455,86" fill="#111827"/>
  <polygon points="450,176 445,166 455,166" fill="#111827"/>
  <text x="462" y="130" font-size="12" fill="#111827">mesafe()</text>
  <text x="462" y="146" font-size="12" fill="#111827">ürün gelince küçülür</text>

  <!-- altyazı -->
  <text x="360" y="294" text-anchor="middle" font-size="11" fill="#6b7280">İki eşik (85 / 75) titremeden doğan çift saymayı önler (histerezis).</text>
</svg>
