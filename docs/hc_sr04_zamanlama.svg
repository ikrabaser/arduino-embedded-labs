<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="720" height="270" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">HC-SR04 zamanlaması: Trig → Echo → mesafe</text>

  <!-- Trig -->
  <text x="30" y="92" font-size="14" font-weight="600" fill="#1e3a8a">Trig</text>
  <polyline points="90,100 180,100 180,70 200,70 200,100 690,100" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="58" text-anchor="middle" font-size="12" fill="#1e3a8a">10 µs darbe</text>

  <!-- ses -->
  <text x="30" y="150" font-size="14" font-weight="600" fill="#6b7280">Ses</text>
  <path d="M 205 150 q 10 -14 20 0 t 20 0 t 20 0 t 20 0" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="285" y="154" font-size="12" fill="#6b7280">8 darbe gider, geri döner</text>

  <!-- Echo -->
  <text x="30" y="212" font-size="14" font-weight="600" fill="#047857">Echo</text>
  <polyline points="90,220 250,220 250,190 560,190 560,220 690,220" fill="none" stroke="#059669" stroke-width="2"/>
  <line x1="250" y1="236" x2="560" y2="236" stroke="#111827" stroke-width="1.2"/>
  <polygon points="250,236 260,231 260,241" fill="#111827"/>
  <polygon points="560,236 550,231 550,241" fill="#111827"/>
  <text x="405" y="256" text-anchor="middle" font-size="13" fill="#111827">süre = pulseIn(ECHO, HIGH)</text>

  <!-- formül -->
  <rect x="450" y="120" width="240" height="52" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="570" y="142" text-anchor="middle" font-size="13" fill="#111827">mesafe (cm) = süre (µs) × 0.034 / 2</text>
  <text x="570" y="161" text-anchor="middle" font-size="11" fill="#6b7280">/2: ses gidiş-dönüş yaptı</text>
</svg>
