<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="720" height="280" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">2 potansiyometre → 2 adım motoru</text>

  <!-- potlar -->
  <rect x="30" y="56" width="120" height="56" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="90" y="80" text-anchor="middle" font-size="13" fill="#92400e">Pot 1</text>
  <text x="90" y="98" text-anchor="middle" font-size="11" fill="#92400e">orta uç → A0</text>
  <rect x="30" y="168" width="120" height="56" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="90" y="192" text-anchor="middle" font-size="13" fill="#92400e">Pot 2</text>
  <text x="90" y="210" text-anchor="middle" font-size="11" fill="#92400e">orta uç → A1</text>

  <!-- arduino -->
  <rect x="230" y="48" width="170" height="184" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="315" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Arduino</text>
  <text x="315" y="104" text-anchor="middle" font-size="11" fill="#1e3a8a">analogRead → 0..1023</text>
  <text x="315" y="124" text-anchor="middle" font-size="11" fill="#1e3a8a">map → −64..+64 (konum)</text>
  <text x="315" y="144" text-anchor="middle" font-size="11" fill="#1e3a8a">fark = eski − yeni</text>
  <text x="315" y="164" text-anchor="middle" font-size="11" fill="#1e3a8a">fark kadar adım, işarete</text>
  <text x="315" y="180" text-anchor="middle" font-size="11" fill="#1e3a8a">göre yön</text>
  <text x="315" y="212" text-anchor="middle" font-size="11" fill="#1e3a8a">D2–D5 | D6–D9</text>

  <!-- sürücüler -->
  <rect x="470" y="56" width="110" height="56" rx="8" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="525" y="80" text-anchor="middle" font-size="13" fill="#111827">Sürücü 1</text>
  <text x="525" y="98" text-anchor="middle" font-size="11" fill="#4b5563">(ULN2003)</text>
  <rect x="470" y="168" width="110" height="56" rx="8" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="525" y="192" text-anchor="middle" font-size="13" fill="#111827">Sürücü 2</text>
  <text x="525" y="210" text-anchor="middle" font-size="11" fill="#4b5563">(ULN2003)</text>

  <!-- motorlar -->
  <circle cx="650" cy="84" r="32" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="650" y="89" text-anchor="middle" font-size="12" fill="#065f46">Motor 1</text>
  <circle cx="650" cy="196" r="32" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="650" y="201" text-anchor="middle" font-size="12" fill="#065f46">Motor 2</text>

  <!-- oklar -->
  <line x1="150" y1="84" x2="228" y2="84" stroke="#374151" stroke-width="1.5" marker-end="url(#ok)"/>
  <line x1="150" y1="196" x2="228" y2="196" stroke="#374151" stroke-width="1.5" marker-end="url(#ok)"/>
  <line x1="400" y1="84" x2="468" y2="84" stroke="#374151" stroke-width="1.5" marker-end="url(#ok)"/>
  <line x1="400" y1="196" x2="468" y2="196" stroke="#374151" stroke-width="1.5" marker-end="url(#ok)"/>
  <line x1="580" y1="84" x2="616" y2="84" stroke="#374151" stroke-width="1.5" marker-end="url(#ok)"/>
  <line x1="580" y1="196" x2="616" y2="196" stroke="#374151" stroke-width="1.5" marker-end="url(#ok)"/>

  <text x="360" y="262" text-anchor="middle" font-size="11" fill="#6b7280">Motor potun mutlak konumuna değil, değişimine göre döner.</text>
</svg>
